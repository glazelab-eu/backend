server.port=${PORT:8080}
# Profiles: dev (default; H2, OpenAPI on) and prod (PostgreSQL, OpenAPI off). Settings here apply to both.
spring.profiles.default=dev
# Deprecated alias: deployments that still set SPRING_PROFILES_ACTIVE=postgres get prod.
spring.profiles.group.postgres=prod
spring.jpa.hibernate.ddl-auto=validate
# Baseline an existing pre-Flyway database explicitly, after backup/review.
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.web.resources.add-mappings=false
# JSON enums accept only their names, never ordinals (e.g. image visibility 2 is not PRIVATE).
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
# A missing Optional request field is null, an explicit null is empty: an edit keeps what it leaves out.
spring.jackson.deserialization.use-null-for-missing-reference-values=true
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB
# Any other body is refused above 128 KB (security.BodySizeFilter); a form sign-in is parsed by Tomcat, capped here.
server.tomcat.max-http-form-post-size=128KB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Sign-ins (security.LoginSessions) live in the database behind a persistent HttpOnly, SameSite=Lax cookie (Secure
# with server.servlet.session.cookie.secure, i.e. GLAZELAB_SECURE_COOKIES in prod): they survive API restarts,
# deployments and browser restarts. A session ends 30 days after its last use or 365 days after the sign-in; use
# renews the stored time at most once per renew-after, so other requests write nothing. Only a sign-in sends the
# cookie (Max-Age = absolute timeout); renewal never re-sends it (backend guide "Sessions").
# The servlet session is unused (the settings above only harden it should anything ever create one).
glazelab.session.idle-timeout=30d
glazelab.session.absolute-timeout=365d
glazelab.session.renew-after=1d
# Image storage: file (default; GLAZELAB_IMAGES directory) or s3 (S3-compatible, e.g. Hetzner Object Storage).
glazelab.storage=${GLAZELAB_STORAGE:file}
glazelab.images.path=${GLAZELAB_IMAGES:./data/images}
# Profile pictures (backend guide "Profile pictures"). The retention is promised by the terms
# (terms.section.profilePicture): changing it changes the terms text and version.
glazelab.avatar.evidence-retention=90d
glazelab.avatar.block-distance=8
# The site admins' log (admin_action: bans, unbans, picture removals, club admin promotions) is kept this long
# (backend guide "Bans"; promised by the terms, terms.section.account: changing it changes the terms text and version).
glazelab.admin.action-retention=90d
# Moderation (backend guides "Photos" and "Profile pictures"): photo and profile picture reports nobody decides are
# closed this long after they were opened (photo reports deleted like a dismissal, profile picture reports CLOSED and
# their evidence copies deleted); the photo deletion log (image_deletion) keeps its rows this long.
glazelab.moderation.report-expiry=90d
glazelab.image-deletion-log.retention=90d
# Scheduled purges (sessions, pending accounts, reports, evidence, feedback, admin log, deletion log, sync log) share this pool: two
# threads, so one purge waiting on a row lock never holds up the others (prod also bounds lock waits, lock_timeout).
spring.task.scheduling.pool.size=2
# Opt-in error reports (backend guide "Error reports"). The retention is promised by the terms (terms.section.diagnostics):
# changing it changes the terms text and version. An account's reports beyond the daily cap (24 hours) are dropped.
glazelab.reports.retention=30d
glazelab.reports.daily-cap=500
# In-app feedback (backend guide "Feedback"): deleted this long after a site admin marked it done (promised by the terms,
# terms.section.diagnostics.feedback: changing it changes the terms text).
glazelab.feedback.retention=90d
# Account bans (backend guide "Bans"): the blocklist stores only HMAC-SHA-256 hashes of banned addresses under this
# secret (at least 32 characters, no default outside dev: the API refuses to start without it). Set it once and back it
# up with the other secrets if the bans should survive: a lost or changed secret empties the effective ban list.
glazelab.ban.secret=${GLAZELAB_BAN_SECRET:}
glazelab.s3.endpoint=${GLAZELAB_S3_ENDPOINT:}
glazelab.s3.region=${GLAZELAB_S3_REGION:}
glazelab.s3.bucket=${GLAZELAB_S3_BUCKET:}
glazelab.s3.access-key=${GLAZELAB_S3_ACCESS_KEY:}
glazelab.s3.secret-key=${GLAZELAB_S3_SECRET_KEY:}
glazelab.s3.path-style=${GLAZELAB_S3_PATH_STYLE:false}

# Rate limits per client (real IP; signed-in sessions per IP and account): token buckets of "burst" requests,
# refilled at "per-minute". GLAZELAB_RATE_LIMIT=false turns limits and tarpit off; GLAZELAB_RATE_LIMIT_FACTOR
# scales every budget (e.g. 100 for load tests). docs/guide/security.md explains the sizing.
glazelab.rate-limit.enabled=${GLAZELAB_RATE_LIMIT:true}
glazelab.rate-limit.factor=${GLAZELAB_RATE_LIMIT_FACTOR:1}
glazelab.rate-limit.api.burst=120
glazelab.rate-limit.api.per-minute=60
glazelab.rate-limit.images.burst=600
glazelab.rate-limit.images.per-minute=300
glazelab.rate-limit.auth.burst=10
glazelab.rate-limit.auth.per-minute=6
glazelab.rate-limit.contact.burst=5
glazelab.rate-limit.contact.per-minute=2
# Buddy link previews and requests (token guessing), per address and account, never boosted for signed-in sessions.
glazelab.rate-limit.token.burst=20
glazelab.rate-limit.token.per-minute=6
# Profile picture uploads (POST /api/avatars) per IP and account, never boosted: each is a full decode and encode.
glazelab.rate-limit.avatar.burst=5
glazelab.rate-limit.avatar.per-minute=1
# Error report batches (POST /api/reports) per IP and account, never boosted: the app sends at most 20 events in
# 10 minutes, so 2 a minute is its steady pace.
glazelab.rate-limit.reports.burst=6
glazelab.rate-limit.reports.per-minute=2
# Feedback (POST /api/feedback, up to three photos encoded) per IP and account, never boosted: 5 at once, then 6 an hour.
glazelab.rate-limit.feedback.burst=5
glazelab.rate-limit.feedback.per-minute=0.1
glazelab.rate-limit.signed-in-factor=4
glazelab.rate-limit.max-clients=20000
# Sign-in delay per address (also unknown ones), whichever IP tries: from the 5th attempt without a success on, the next
# waits 1 minute, doubling up to 15; a success, a magic link or a reset ends it. Not scaled by the factor.
glazelab.rate-limit.sign-in.free-failures=5
glazelab.rate-limit.sign-in.first-delay=1m
glazelab.rate-limit.sign-in.max-delay=15m
glazelab.rate-limit.sign-in.forget-after=24h
# Tarpit: a client rejected in 30 different seconds, or asking for 20 unknown images, within 5 minutes is
# flagged for 15 minutes; then 20 % of its GETs get a slow random-byte decoy (16 KiB/s, at most 2 MiB or
# 2 minutes, 8 at once). GLAZELAB_TARPIT=false keeps the limits but answers 429 only.
glazelab.rate-limit.tarpit.enabled=${GLAZELAB_TARPIT:true}
glazelab.rate-limit.tarpit.rejected-seconds=30
glazelab.rate-limit.tarpit.unknown-images=20
glazelab.rate-limit.tarpit.window=5m
glazelab.rate-limit.tarpit.flag-for=15m
glazelab.rate-limit.tarpit.probability=0.2
glazelab.rate-limit.tarpit.max-connections=8
glazelab.rate-limit.tarpit.chunk-bytes=16384
glazelab.rate-limit.tarpit.interval=1s
glazelab.rate-limit.tarpit.max-bytes=2097152
glazelab.rate-limit.tarpit.max-duration=2m

springdoc.api-docs.path=/api/openapi
springdoc.paths-to-match=/api/**
springdoc.override-with-generic-response=false

# An empty SMTP host disables email and skips registration verification.
spring.mail.host=${GLAZELAB_SMTP_HOST:}
spring.mail.port=${GLAZELAB_SMTP_PORT:587}
spring.mail.username=${GLAZELAB_SMTP_USERNAME:}
spring.mail.password=${GLAZELAB_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${GLAZELAB_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${GLAZELAB_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${GLAZELAB_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${GLAZELAB_SMTP_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
glazelab.mail.from=${GLAZELAB_MAIL_FROM:}
glazelab.public-url=${GLAZELAB_PUBLIC_URL:}
glazelab.operator-email=${GLAZELAB_OPERATOR_EMAIL:}
# The AGPL source offer: where this server's source code is published (absolute http(s) URL). No default: the app's
# "Source code" link stays hidden while it is unset (backend guide "Security").
glazelab.source-url=${GLAZELAB_SOURCE_URL:}
# Activity feed (backend guide "Activity feed"): how far back it reads. Nothing is stored per entry, so this is a
# display bound only, not a retention.
glazelab.feed.window=30d
