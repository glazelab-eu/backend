# Local development: file-based H2 and the OpenAPI document at /api/openapi (the client generation: docs/guide/contract.md).
spring.datasource.url=jdbc:h2:file:${GLAZELAB_DATA:./data}/glazelab
spring.datasource.username=sa
spring.datasource.password=
# H2 breaks the CHECK constraint account_token_purpose_check (created by the Java migration V6) once the pool retires the
# connection that existed at startup: with the default max lifetime of 30 minutes every later insert into account_token fails
# with 23514 "The database has been closed" (the e2e registration 409 after about 30 minutes; reproduced with a 30 s lifetime).
# Never retire connections in development; production runs PostgreSQL and is not affected.
spring.datasource.hikari.max-lifetime=0
# A published development default for the ban blocklist's key (dev data only; the prod profile refuses any value
# starting with dev-only-). Production sets GLAZELAB_BAN_SECRET.
glazelab.ban.secret=${GLAZELAB_BAN_SECRET:dev-only-ban-secret-3f9c2a7e5b1d48c6a0e2f4b8d6c1a9e7}
