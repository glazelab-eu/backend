# Production: PostgreSQL behind the Nginx/Traefik proxy. Secrets come from the environment only.
spring.datasource.url=${GLAZELAB_DB_URL:jdbc:postgresql://localhost:5432/glazelab}
spring.datasource.username=${GLAZELAB_DB_USER:glazelab}
# No default: RequiredDatabasePassword fails the start when GLAZELAB_DB_PASSWORD is unset (Boot would keep the placeholder as literal text).
spring.datasource.password=${GLAZELAB_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# PostgreSQL's error detail echoes row values ("Key (email)=(...) already exists") into exception messages and the
# Hibernate error log. Set here, not in the URL, so it holds whatever GLAZELAB_DB_URL an operator supplies.
spring.datasource.hikari.data-source-properties.logServerErrorDetail=false
# Stated, not left to defaults: 10 connections, a request waits at most 30 s for one. Picture downloads read the object
# store outside any transaction (controller.Pictures), so a slow store never holds one.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=30000
# Every session (Flyway's included) waits at most 10 s for a row or table lock, then fails (500, logged) instead of
# queueing for ever behind a stuck transaction. Only lock waits count: long statements and reads are not cut
# (no statement_timeout). Like logServerErrorDetail, an "options" parameter in GLAZELAB_DB_URL would win: never set one.
spring.datasource.hikari.data-source-properties.options=-c lock_timeout=10s
# The API document is generated in dev only; /api/openapi answers 404 here.
springdoc.api-docs.enabled=false
# Public registrations need mailbox proof; mail-free registration is only for local development.
glazelab.require-email-verification=true
# Trust X-Forwarded-For/-Proto only from private-network proxies (Tomcat RemoteIpValve), so the
# request sees https and the real client IP. Keep the API port unreachable except through the proxy.
server.forward-headers-strategy=native
server.servlet.session.cookie.secure=${GLAZELAB_SECURE_COOKIES:true}
